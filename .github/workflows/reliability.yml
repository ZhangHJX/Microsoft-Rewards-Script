name: Offline reliability tests

on:
    push:
        branches: [codex/single-account-cloud]
        paths:
            - 'src/**'
            - 'scripts/**'
            - 'tests/**'
            - 'config/**'
            - 'package*.json'
            - 'tsconfig.json'
            - '.github/workflows/reliability.yml'
    pull_request:
        paths:
            - 'src/**'
            - 'scripts/**'
            - 'tests/**'
            - 'config/**'
            - 'package*.json'
            - 'tsconfig.json'
            - '.github/workflows/reliability.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: offline-reliability-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    offline:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  cache: npm
            - name: Install locked dependencies without lifecycle scripts
              run: npm ci --ignore-scripts --no-audit --no-fund
            - name: Build and run synthetic reliability tests
              run: npm run test:reliability
